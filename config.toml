# bentham config — all fields optional, these are the defaults

data_dir = "data"

[discord]
# Bot token: DISCORD_TOKEN env var wins, else read from this file (trimmed).
token_file = "data/discord-token"

[mcp]
port = 43117

[claude]
binary = "claude"
model = "sonnet"
# Start a fresh session (persona = its only memory) after this many wakes.
session_max_wakes = 50
# Wait this long after first activity in a channel before waking it, to batch bursts.
debounce_seconds = 3
# Kill a Claude turn that runs longer than this.
turn_timeout_minutes = 30
# Tools the bot may NOT use (it always gets the discord MCP server).
# Everything filesystem-shaped is denied — the turn's cwd holds the bot token.
disallowed_tools = ["Bash", "Edit", "Write", "Read", "Glob", "Grep", "LS", "NotebookEdit", "NotebookRead", "Task"]
# Extra args appended to every claude invocation.
extra_args = []
